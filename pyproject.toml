[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mi-lab"
version = "0.1.0"
description = "Reproducible ECG-only STEMI versus NSTEMI research baseline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "pandas>=2,<3", "scipy>=1.10,<2", "scikit-learn>=1.3,<2", "matplotlib>=3.7,<4", "joblib>=1.3,<2", "wfdb>=4.1,<5", "markdown>=3.6,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
cnn = ["torch>=2.2,<3"]

[project.scripts]
mi-lab = "mi_lab.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
